; 서버 브라우저의 조종 중계 (2026-11-14): 컨테이너 밖의 Cairn 서버가 콘솔 화면(그림 · 클릭 · 입력)을 위해 Chrome에 붙는 길.
; Chrome은 조종 포트를 127.0.0.1(9222)에만 연다. 9223으로 받아 그대로 넘긴다 (cdp-relay.py).
; 이 컨테이너는 서버와만 붙는 망(browser)에만 있어 9223은 서버(와 같은 네트워크를 쓰는 서버 러너)만 닿는다 (docker-compose.browser.yml).
[program:cdp-relay]
command=/usr/bin/python3 /usr/local/lib/cairn/cdp-relay.py
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/cdp-relay.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

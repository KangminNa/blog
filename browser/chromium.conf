; Cairn 서버 브라우저의 Chromium 실행 (neko의 /etc/neko/supervisord/chromium.conf를 바꾼다, 2026-11-08 시험으로 확인).
; 바꾼 것: --bwsi(게스트: 끄면 로그인이 사라짐)를 뺐다 · --remote-debugging-port=9222(CDP, 컨테이너 안 127.0.0.1에만 열림)
;          · --password-store=basic(키링이 없는 컨테이너에서 쿠키 암호화 키를 고정) · --force-dark-mode를 뺐다
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --start-maximized
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --remote-debugging-port=9222
  --password-store=basic
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

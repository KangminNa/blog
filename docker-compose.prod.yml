# Cairn 운영 환경. 컴파일한 이미지만 돌린다 (감시 모드 없음, 소스 마운트 없음, root가 아닌 사용자)
#   서버의 .env에 COMPOSE_FILE=docker-compose.prod.yml 을 적으면 docker compose 명령이 모두 이 파일을 쓴다
#   docker compose up -d --build   →  db → migrate(마이그레이션 적용 후 종료) → server · worker → web
#   서버 러너는 함께 뜨고 스스로 연결한다 (볼륨 runner-pairing의 연결 값). 콘솔 AI 메뉴에 Claude 토큰을 넣으면 일한다
#
# 프록시 네트워크에 붙이는 docker-compose.override.yml은 파일을 직접 고르면 저절로 합쳐지지 않으므로 함께 적는다:
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.override.yml
#
# 프로젝트 이름과 볼륨이 docker-compose.yml과 같아서, 개발 compose로 돌리던 서버의 DB를 그대로 이어 쓴다.
# 서로 부르는 이름(cairn-db · cairn-server · cairn-web)도 같다. 웹의 서버 주소는 Dockerfile에서 이 이름으로 빌드한다.
# 슬롯(CAIRN_IMAGE_TAG · 포트 · COMPOSE_PROJECT_NAME)도 개발과 같은 방식으로 나뉜다 (scripts/slot.mjs)
name: cairn

x-db-url: &db-url postgres://cairn:${DB_PASSWORD:?.env에 DB_PASSWORD를 넣어 주세요}@cairn-db:5432/cairn?sslmode=disable

x-secret-keys: &secret-keys
  CAIRN_SECRET_KEY: ${CAIRN_SECRET_KEY:?.env에 CAIRN_SECRET_KEY를 넣어 주세요 (pnpm secret:new 또는 openssl rand -base64 32)}
  CAIRN_SECRET_KEY_OLD: ${CAIRN_SECRET_KEY_OLD:-}   # 서버 키를 바꾸는 동안에만 (순서는 .env.example)

services:
  db:
    build: ./db
    image: cairn-db:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    networks:
      default:
        aliases: [cairn-db]
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 넣어 주세요}
      POSTGRES_DB: cairn
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile.migrate
    image: cairn-migrate:${CAIRN_IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: *db-url
    # 코어와 기능 패키지의 마이그레이션 (이미지에 담긴 plugins/<이름>/migrations). 인자는 dbmate 명령 (기본 up)
    entrypoint:
      - /bin/sh
      - -c
      - |
        dirs="--migrations-dir /db/migrations"
        for d in /plugins/*/migrations; do [ -d "$$d" ] && dirs="$$dirs --migrations-dir $$d"; done
        exec dbmate --wait --no-dump-schema $$dirs "$$@"
      - migrate
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      target: server
    image: cairn-server:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    networks:
      default:
        aliases: [cairn-server]
    environment:
      <<: *secret-keys
      DATABASE_URL: *db-url
      PORT: 4000
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost:${WEB_PORT:-3000}}   # 사람이 여는 웹 주소 (설치 코드 안내에 씀)
      CAIRN_BLOBS_DIR: /data/blobs   # 올린 사진. DB와 함께 백업한다
      CAIRN_OUTPUTS_MAX_GB: ${CAIRN_OUTPUTS_MAX_GB:-80}     # 결과물(AI가 만든 파일)을 모두 더한 한도
      CAIRN_DISK_RESERVE_GB: ${CAIRN_DISK_RESERVE_GB:-20}   # 디스크에 늘 남길 몫. 이보다 적으면 결과물을 받지 않는다 (DB를 지키려고)
      CAIRN_RUNNER_PAIRING_FILE: /run/cairn-runner/pairing   # 서버 러너의 연결 값. 서버가 시작할 때 쓴다
    ports:
      - "127.0.0.1:${SERVER_PORT:-4000}:4000"   # 이 컴퓨터에서만. 밖에는 앞의 https 프록시만 연다
    volumes:
      - blob-data:/data/blobs   # 이미지가 node 사용자의 폴더로 만들어 둔다 (Dockerfile)
      - runner-pairing:/run/cairn-runner   # 서버와 러너만 붙는다
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: cairn-server:${CAIRN_IMAGE_TAG:-dev}   # 일꾼: 이벤트 넘기기와 플러그인 반복 작업. 하나만 띄운다. HTTP가 없어 상태 확인은 두지 않는다
    pull_policy: never
    restart: unless-stopped
    command: ["node", "src/main.worker.js"]
    environment:
      <<: *secret-keys
      DATABASE_URL: *db-url
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost:${WEB_PORT:-3000}}   # 브라우저 푸시의 연락처 (https일 때)
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: cairn-web:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    networks:
      default:
        aliases: [cairn-web]
    environment:   # 서버 키를 주지 않는다. 웹은 서버 API만 부른다
      API_URL: http://cairn-server:4000
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost:${WEB_PORT:-3000}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"   # 이 컴퓨터에서만. 밖에는 앞의 https 프록시만 연다
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then((r)=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      server:
        condition: service_healthy

  # 서버 러너: 일을 빌려 Claude CLI로 처리한다. 함께 뜨고, 사람이 토큰을 옮기지 않는다:
  # 서버가 볼륨에 쓴 연결 값을 내밀고 토큰을 받아 메모리에만 둔다 (끊기면 다시 받는다). Claude 토큰이 없으면 일을 빌리지 않고 기다린다.
  # 서버 키와 DB 주소를 주지 않는다. 받는 포트가 없고, 볼륨은 연결 값을 읽기만 한다. 나가는 요청으로 서버만 부른다.
  # 쓸 수 있는 곳은 메모리에 있는 /tmp와 홈뿐이고 컨테이너가 끝나면 사라진다. 일의 자리도 /tmp 안에 만들고 지운다
  # 서버 러너를 쓰지 않으려면 콘솔의 러너 메뉴에서 일 받기를 끈다 (docker compose up -d --scale runner=0도 된다)
  runner:
    build:
      context: .
      target: runner
      args:
        CAIRN_RUNNER_BUILD: ${CAIRN_RUNNER_BUILD:-unknown}   # 실행 기록에 남는 러너 빌드 (git rev-parse --short HEAD)
    image: cairn-runner:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true                # AI CLI가 남긴 손자 프로세스를 거둔다
    stop_grace_period: 40s    # 첫 신호는 기다리는 next_jobs(25초)가 끝나기를 기다렸다가 일을 돌려준다
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node:size=64m,uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      CAIRN_RUNNER_URL: http://cairn-server:4000
      CAIRN_RUNNER_PAIRING_FILE: /run/cairn-runner/pairing
      CAIRN_RUNNER_CONCURRENCY: ${CAIRN_RUNNER_CONCURRENCY:-3}   # 동시에 하는 일 (1~8). 일마다 AI CLI 하나
      CAIRN_RUNNER_TOKEN: ${CAIRN_RUNNER_TOKEN:-}   # 넣으면 연결 값 대신 이 토큰을 쓴다 (예전 방식)
    volumes:
      - runner-pairing:/run/cairn-runner:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  blob-data:
  runner-pairing:   # 서버 러너의 연결 값 (서버가 쓰고 러너가 읽는다). 지워도 서버가 다시 뜰 때 다시 쓴다

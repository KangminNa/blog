# Cairn 개발 환경
#   docker compose up --build   →  db → migrate(마이그레이션 적용 후 종료) → server · worker → web · runner
#   docker compose build        →  db 이미지와 앱 이미지를 함께 빌드
#
# 서로 부르는 이름은 cairn-db · cairn-server · cairn-web (cairn- 이 붙은 별명).
# 다른 프로젝트와 같이 쓰는 네트워크(프록시용)에 붙여도 db · server 같은 흔한 이름과 섞이지 않게.
# 프록시 네트워크에 붙이는 설정은 서버에만 두는 docker-compose.override.yml로 한다 (README "설치")
# 병렬 작업은 pnpm slot <번호> …으로 프로젝트·포트·이미지 태그를 나눈다 (scripts/slot.mjs)
name: cairn

x-db-url: &db-url postgres://cairn:${DB_PASSWORD:-cairn}@cairn-db:5432/cairn?sslmode=disable

services:
  db:
    build: ./db
    image: cairn-db:${CAIRN_IMAGE_TAG:-dev}
    networks:
      default:
        aliases: [cairn-db]
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cairn}
      POSTGRES_DB: cairn
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # 이 컴퓨터에서만 (같은 와이파이의 다른 기기는 못 붙음)
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: *db-url
    # 코어 마이그레이션과 기능 패키지(plugins/<이름>/migrations, 자기 스키마만)의 폴더를 모두 넘겨 dbmate를 돈다.
    # 인자는 dbmate 명령 (기본 up): docker compose run --rm migrate rollback
    entrypoint:
      - /bin/sh
      - -c
      - |
        dirs="--migrations-dir /db/migrations"
        for d in /plugins/*/migrations; do [ -d "$$d" ] && dirs="$$dirs --migrations-dir $$d"; done
        exec dbmate --wait --no-dump-schema $$dirs "$$@"
      - migrate
    command: ["up"]
    volumes:
      - ./db/migrations:/db/migrations
      - ./plugins:/plugins:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      target: dev
    image: cairn-app:${CAIRN_IMAGE_TAG:-dev}
    networks:
      default:
        aliases: [cairn-server]
    command: ["pnpm", "--filter", "@cairn/server", "dev"]
    env_file:
      - path: .env          # 서버 키(CAIRN_SECRET_KEY) 등 인프라 설정. 플러그인 설정은 DB에
        required: false
    environment:
      DATABASE_URL: *db-url
      PORT: 4000
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost:${WEB_PORT:-3000}}   # 사람이 여는 웹 주소 (설치 코드 안내에 씀)
      CAIRN_BLOBS_DIR: /data/blobs   # 올린 사진. 파일 이름은 내용의 sha256
      CAIRN_SECRET_KEY: ${CAIRN_SECRET_KEY:-}   # .env 값. 슬롯은 scripts/slot.mjs가 넘긴다
      CAIRN_RUNNER_PAIRING_FILE: /run/cairn-runner/pairing   # 서버 러너의 연결 값. 서버가 시작할 때 쓴다
    ports:
      - "127.0.0.1:${SERVER_PORT:-4000}:4000"   # 이 컴퓨터에서만. 웹은 컨테이너끼리 server:4000으로 부른다
    volumes:
      - ./apps/server/src:/repo/apps/server/src
      - ./plugins:/repo/plugins
      - ./skills:/repo/skills   # 앱에 올릴 스킬 묶음(관리 화면 → 기기 → 스킬 받기)을 여기서 만든다
      - blob-data:/data/blobs
      - runner-pairing:/run/cairn-runner   # 서버와 러너만 붙는다
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: cairn-app:${CAIRN_IMAGE_TAG:-dev}          # 일꾼: 이벤트 넘기기와 플러그인 반복 작업. 하나만 띄운다
    pull_policy: never
    command: ["pnpm", "--filter", "@cairn/server", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db-url
      CAIRN_SECRET_KEY: ${CAIRN_SECRET_KEY:-}
    volumes:
      - ./apps/server/src:/repo/apps/server/src
      - ./plugins:/repo/plugins
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_started

  web:
    image: cairn-app:${CAIRN_IMAGE_TAG:-dev}          # server가 빌드한 같은 이미지를 씀
    networks:
      default:
        aliases: [cairn-web]
    pull_policy: never
    command: ["pnpm", "--filter", "@cairn/web", "dev"]
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://cairn-server:4000
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost:${WEB_PORT:-3000}}   # 이 주소에서 연 화면만 개발 서버가 받아 준다
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"   # 이 컴퓨터에서만. 서버에 올리면 앞의 https 프록시(Caddy 등)만 밖에 연다
    volumes:
      - ./apps/web/app:/repo/apps/web/app
      - ./plugins:/repo/plugins
    depends_on:
      server:
        condition: service_started

  # 러너: 운영과 같은 이미지로 띄워 서버 러너처럼 스스로 연결한다. 로컬에서도 토큰을 옮기지 않고 웹에서만 시험한다.
  # 콘솔 AI 메뉴에 Claude 토큰을 넣으면 일한다. 러너 코드를 고쳤으면 docker compose up --build로 다시 만든다
  runner:
    build:
      context: .
      target: runner
    image: cairn-runner:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node:size=64m,uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      CAIRN_RUNNER_URL: http://cairn-server:4000
      CAIRN_RUNNER_PAIRING_FILE: /run/cairn-runner/pairing
    volumes:
      - runner-pairing:/run/cairn-runner:ro
    depends_on:
      server:
        condition: service_started

volumes:
  db-data:
  blob-data:
  runner-pairing:   # 서버 러너의 연결 값 (서버가 쓰고 러너가 읽는다)

# Cairn 개발 환경
#   docker compose up --build   →  db → migrate(마이그레이션 적용 후 종료) → server · worker → web
#   docker compose build        →  db 이미지와 앱 이미지를 함께 빌드
name: cairn

x-db-url: &db-url postgres://cairn:${DB_PASSWORD:-cairn}@db:5432/cairn?sslmode=disable

services:
  db:
    build: ./db
    image: cairn-db:dev
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cairn}
      POSTGRES_DB: cairn
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # 이 컴퓨터에서만 (같은 와이파이의 다른 기기는 못 붙음)
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: *db-url
    command: ["--wait", "--no-dump-schema", "--migrations-dir", "/db/migrations", "up"]
    volumes:
      - ./db/migrations:/db/migrations
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      target: dev
    image: cairn-app:dev
    command: ["pnpm", "--filter", "@cairn/server", "dev"]
    env_file:
      - path: .env          # 서버 키(CAIRN_SECRET_KEY) 등 인프라 설정. 플러그인 설정은 DB에
        required: false
    environment:
      DATABASE_URL: *db-url
      PORT: 4000
      CAIRN_WEB_URL: http://localhost:${WEB_PORT:-3000}   # 사람이 여는 웹 주소 (설치 코드 안내에 씀)
    ports:
      - "127.0.0.1:${SERVER_PORT:-4000}:4000"   # 이 컴퓨터에서만. 웹은 컨테이너끼리 server:4000으로 부른다
    volumes:
      - ./apps/server/src:/repo/apps/server/src
      - ./plugins:/repo/plugins
      - ./skills:/repo/skills   # 앱에 올릴 스킬 묶음(관리 화면 → 기기 → 스킬 받기)을 여기서 만든다
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: cairn-app:dev          # 일꾼: 이벤트 넘기기와 플러그인 반복 작업. 하나만 띄운다
    pull_policy: never
    command: ["pnpm", "--filter", "@cairn/server", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db-url
    volumes:
      - ./apps/server/src:/repo/apps/server/src
      - ./plugins:/repo/plugins
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_started

  web:
    image: cairn-app:dev          # server가 빌드한 같은 이미지를 씀
    pull_policy: never
    command: ["pnpm", "--filter", "@cairn/web", "dev"]
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://server:4000
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/app:/repo/apps/web/app
      - ./plugins:/repo/plugins
    depends_on:
      server:
        condition: service_started

volumes:
  db-data:

# 브라우저 에이전트 (선택). 운영 구성에 더해 쓴다: .env에 COMPOSE_FILE=docker-compose.prod.yml:docker-compose.browser.yml
# 서버 브라우저(neko)를 띄우고, 서버 러너를 그 네트워크 안에 넣는다: 러너에게 브라우저는 127.0.0.1이라
# Chrome의 Host 검사를 지나고, CDP는 컨테이너 밖으로 열리지 않는다.
# 화면은 콘솔(운영 › 브라우저)에서 HTTPS로 본다 (2026-11-14): 서버가 전용 망(browser)으로 조종 중계(9223)에 붙어 그림을 받고
# 클릭 · 입력을 보낸다. 그래서 UDP · 공인 IP · Caddy 설정이 없어도 된다. neko의 실시간 영상(WebRTC)은 선택이다 (README 6장)
services:
  browser:
    build:
      context: .
      dockerfile: browser/Dockerfile
      args:
        - CAIRN_NEKO_IMAGE   # .env에 있을 때만 넘긴다. 없으면 Dockerfile의 시험한 이미지 (ARM 서버는 .env.example)
    image: cairn-browser:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    shm_size: 1g
    mem_limit: 1g   # 넘치면 브라우저만 죽는다 (시험: 쉬면 약 250MB, 화면을 보면 약 290MB)
    networks: [browser]   # 서버와만 붙는 망. 웹 · DB · 일꾼은 이 망에 없어 조종 중계(9223)에 닿지 않는다
    environment:
      NEKO_DESKTOP_SCREEN: 1280x720@30
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${CAIRN_BROWSER_PASSWORD:?.env에 CAIRN_BROWSER_PASSWORD를 넣어 주세요}
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${CAIRN_BROWSER_PASSWORD}
      NEKO_SERVER_PROXY: "true"
      NEKO_WEBRTC_UDPMUX: "52000"
      NEKO_WEBRTC_ICELITE: "true"
      # 실시간 영상을 쓸 때만 서버의 공인(또는 Tailscale) IP. 콘솔 화면만 쓰면 그대로 둔다
      NEKO_WEBRTC_NAT1TO1: ${CAIRN_PUBLIC_IP:-127.0.0.1}
    volumes:
      - browser-profile:/home/neko/.config/chromium   # 로그인 유지
    ports:
      - "127.0.0.1:${BROWSER_VIEW_PORT:-4100}:8080"   # neko 화면 페이지: 이 서버 안에서만 (실시간 영상을 쓸 때 Caddy가 넘긴다)
      - "${BROWSER_UDP_BIND:-127.0.0.1}:52000:52000/udp"   # 실시간 영상. 기본은 이 서버 안에서만 (밖에 열 때 BROWSER_UDP_BIND)

  # 서버: 콘솔 화면을 위해 브라우저의 전용 망에도 붙는다 (러너가 같은 이름으로 서버를 찾는다)
  server:
    networks:
      default:
        aliases: [cairn-server]
      browser:
        aliases: [cairn-server]

  runner:
    network_mode: service:browser
    depends_on:
      browser:
        condition: service_started
    environment:
      CAIRN_BROWSER_URL: http://127.0.0.1:9222

networks:
  browser: {}   # 서버 브라우저 전용 (바깥 인터넷은 나간다: 브라우저 · 서버 러너가 쓴다)

volumes:
  browser-profile:

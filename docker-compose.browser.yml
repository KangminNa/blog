# 브라우저 에이전트 (선택). 운영 구성에 더해 쓴다: .env에 COMPOSE_FILE=docker-compose.prod.yml:docker-compose.browser.yml
# 서버 브라우저(neko 이미지의 Chromium)를 띄우고, 서버 러너를 그 네트워크 안에 넣는다: 러너에게 브라우저는 127.0.0.1이라
# Chrome의 Host 검사를 지나고, CDP는 컨테이너 밖으로 열리지 않는다.
# 화면은 콘솔(운영 › 브라우저)에서 HTTPS로 본다: 서버가 전용 망(browser)으로 조종 중계(9223)에 붙어 그림을 받고
# 클릭 · 입력을 보내고 사이트 세션을 지운다. 밖으로 여는 포트도 비밀번호도 없다 (neko의 실시간 영상은 2026-11-14에 지웠다)
services:
  browser:
    build:
      context: .
      dockerfile: browser/Dockerfile   # neko 3.2.0 (amd64 · arm64)
    image: cairn-browser:${CAIRN_IMAGE_TAG:-dev}
    restart: unless-stopped
    shm_size: 1g
    mem_limit: 1g   # 넘치면 브라우저만 죽는다 (시험: 쉬면 약 250MB, 화면을 보면 약 290MB)
    networks: [browser]   # 서버와만 붙는 망. 웹 · DB · 일꾼은 이 망에 없어 조종 중계(9223)에 닿지 않는다
    volumes:
      - browser-profile:/home/neko/.config/chromium   # 로그인 유지

  # 서버: 콘솔 화면을 위해 브라우저의 전용 망에도 붙는다 (러너가 같은 이름으로 서버를 찾는다)
  server:
    networks:
      default:
        aliases: [cairn-server]
      browser:
        aliases: [cairn-server]

  runner:
    network_mode: service:browser
    depends_on:
      browser:
        condition: service_started
    environment:
      CAIRN_BROWSER_URL: http://127.0.0.1:9222

networks:
  browser: {}   # 서버 브라우저 전용 (바깥 인터넷은 나간다: 브라우저 · 서버 러너가 쓴다)

volumes:
  browser-profile:
